# Builds a static preview of the homepage (the same snapshot as the Claude artifact) and publishes it
# on GitHub Pages. Needs Pages turned on: Settings → Pages → Source: "GitHub Actions"
# (free accounts: public repos only; private repos need GitHub Pro).
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Static build (plain images, no optimizer)
        run: npm run build
        env:
          SMADI_STATIC: '1'
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Homepage snapshot with relative paths
        run: node scripts/snapshot.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .snapshot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
